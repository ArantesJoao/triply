<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    trip.ly route mark — periwinkle dot trail + destination.

    Square on purpose. A client that shows this beside a server rounds and
    masks the tile itself, so rounding it here only leaves transparent
    corners to composite over whatever that client puts behind them — which
    is how the halo shows up.

    The rect is drawn a unit past the viewBox on every side. SVG clips it
    back, but the overdraw means no edge pixel is ever partially covered, so
    rasterising at a fractional scale cannot leave a semi-transparent hairline
    to composite into a pale outline.
  -->
  <rect x="-1" y="-1" width="34" height="34" fill="#6366F1"/>
  <!-- Trail dots, rising and dipping -->
  <circle cx="5" cy="22" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="9" cy="19" r="1.6" fill="#fff" opacity="0.6"/>
  <circle cx="13" cy="16.5" r="1.7" fill="#fff" opacity="0.7"/>
  <circle cx="17" cy="18" r="1.8" fill="#fff" opacity="0.8"/>
  <circle cx="21" cy="15" r="1.9" fill="#fff" opacity="0.9"/>
  <!-- Destination dot -->
  <circle cx="26" cy="11" r="3.5" fill="#fff"/>
</svg>
