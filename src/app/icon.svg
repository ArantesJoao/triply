<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    trip.ly favicon — periwinkle dot trail + destination.

    Square and fully opaque, like mcp-icon.svg, and for the same reason: this
    is the one icon path advertised in our HTML (`<link rel="icon">`, which
    Next generates from this file), so it is the first thing anything
    crawling the site for a logo finds. It used to carry `rx="7"`, and a
    client that rasterises it onto a light sheet before masking turned those
    transparent corners into four white wedges around the tile — the halo
    every other icon here is already shaped to avoid. A tab renders the given
    pixels as-is, so a square favicon just looks like a normal favicon; the
    rounded version of the mark is `RouteTile`, inline and unfetchable.

    The rect is drawn a unit past the viewBox on every side. SVG clips it
    back, but the overdraw means no edge pixel is ever partially covered, so
    rasterising at a fractional scale cannot leave a semi-transparent hairline
    to composite into a pale outline.
  -->
  <rect x="-1" y="-1" width="34" height="34" fill="#6366F1"/>
  <!-- Trail dots, rising and dipping -->
  <circle cx="5" cy="22" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="9" cy="19" r="1.6" fill="#fff" opacity="0.6"/>
  <circle cx="13" cy="16.5" r="1.7" fill="#fff" opacity="0.7"/>
  <circle cx="17" cy="18" r="1.8" fill="#fff" opacity="0.8"/>
  <circle cx="21" cy="15" r="1.9" fill="#fff" opacity="0.9"/>
  <!-- Destination dot -->
  <circle cx="26" cy="11" r="3.5" fill="#fff"/>
</svg>
